name: Build Lang La Auto APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # setup-android@v3 defaults to installing the obsolete "tools" package.
      # Google no longer serves that package, so request platform-tools only.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android source ZIP
        run: |
          test -f LangLaAuto_v0.6.0_Source.zip
          mkdir -p extracted
          unzip -q LangLaAuto_v0.6.0_Source.zip -d extracted
          test -f extracted/src/settings.gradle.kts
          test -f extracted/src/app/build.gradle.kts

      - name: Build debug APK
        run: gradle --no-daemon -p extracted/src :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LangLaAuto-v0.6.0-debug
          path: extracted/src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
